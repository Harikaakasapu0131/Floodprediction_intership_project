<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Waters - Flood Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">
    <div class="card p-4">

        <h1 class="title">🌊 Rising Waters</h1>
        <p class="subtitle">
            Machine Learning Based Flood Prediction System
        </p>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="MonsoonIntensity" placeholder="Monsoon Intensity" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="TopographyDrainage" placeholder="Topography Drainage" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="RiverManagement" placeholder="River Management" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Deforestation" placeholder="Deforestation" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Urbanization" placeholder="Urbanization" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="ClimateChange" placeholder="Climate Change" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="DamsQuality" placeholder="Dams Quality" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Siltation" placeholder="Siltation" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="AgriculturalPractices" placeholder="Agricultural Practices" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Encroachments" placeholder="Encroachments" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="IneffectiveDisasterPreparedness" placeholder="Disaster Preparedness" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="DrainageSystems" placeholder="Drainage Systems" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="CoastalVulnerability" placeholder="Coastal Vulnerability" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Landslides" placeholder="Landslides" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="Watersheds" placeholder="Watersheds" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="DeterioratingInfrastructure" placeholder="Infrastructure" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="PopulationScore" placeholder="Population Score" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="WetlandLoss" placeholder="Wetland Loss" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="InadequatePlanning" placeholder="Inadequate Planning" required>
                </div>

                <div class="col-md-4 mb-3">
                    <input type="number" class="form-control" name="PoliticalFactors" placeholder="Political Factors" required>
                </div>

            </div>

            <button type="submit" class="btn btn-primary btn-predict">
                Predict Flood Risk
            </button>

        </form>

    </div>
</div>

</body>
</html>
