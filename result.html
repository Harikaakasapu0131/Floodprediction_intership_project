<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Prediction Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#1e40af,#38bdf8);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
        }

        .card{
            width:700px;
            border:none;
            border-radius:25px;
            padding:30px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,0.3);
        }

        .risk-circle{
            width:220px;
            height:220px;
            border-radius:50%;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
            font-weight:bold;
            color:white;
            background:linear-gradient(135deg,#2563eb,#06b6d4);
        }

        .status{
            font-size:28px;
            font-weight:bold;
            margin-top:20px;
        }

        .btn-home{
            margin-top:25px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1 class="mb-4">🌊 Flood Risk Analysis</h1>

    <div class="risk-circle">
        {{ (prediction*100)|round(1) }}%
    </div>

    {% if prediction < 0.4 %}
        <div class="status text-success">
            ✅ Low Flood Risk
        </div>

    {% elif prediction < 0.7 %}
        <div class="status text-warning">
            ⚠ Moderate Flood Risk
        </div>

    {% else %}
        <div class="status text-danger">
            🚨 High Flood Risk
        </div>
    {% endif %}

    <div class="mt-4">

        <div class="progress" style="height:30px;">
            <div class="progress-bar
            {% if prediction < 0.4 %}
                bg-success
            {% elif prediction < 0.7 %}
                bg-warning
            {% else %}
                bg-danger
            {% endif %}"
            role="progressbar"
            (style="width: {{ prediction*100 }}%">)
            </div>
        </div>

    </div>

    <h4 class="mt-4">
        Predicted Flood Probability:
        <span class="text-primary">
            {{ prediction }}
        </span>
    </h4>

    <a href="/" class="btn btn-primary btn-home">
        Predict Again
    </a>

</div>

</body>
</html>
